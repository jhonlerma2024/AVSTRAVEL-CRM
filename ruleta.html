<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AVSTRAVEL · Tu premio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0D1B2A;--ocean:#0A4A6E;--sky:#1B7FA6;--reef:#00A878;
  --sun:#F2A922;--coral:#E05C3A;--cream:#FDFAF5;--white:#fff;
  --gold:#C8922A;--mist:#7A9AAD;--ease:cubic-bezier(.25,.46,.45,.94);
}
html,body{min-height:100vh;font-family:'Jost',sans-serif;background:var(--cream);color:var(--ink);overflow-x:hidden}

/* ── BG ANIMADO ── */
.bg{
  position:fixed;inset:0;z-index:0;
  background:linear-gradient(160deg,#051525 0%,#082540 45%,#0A3D5F 100%);
  overflow:hidden;
}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) ease-in-out infinite var(--dl,0s)}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(1)}50%{opacity:.6;transform:scale(1.4)}}
.glow{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none}
.g1{width:500px;height:500px;background:radial-gradient(circle,rgba(0,168,120,.2),transparent 70%);top:-100px;left:-100px;animation:dg1 12s ease-in-out infinite alternate}
.g2{width:400px;height:400px;background:radial-gradient(circle,rgba(242,169,34,.15),transparent 70%);bottom:-80px;right:-80px;animation:dg2 15s ease-in-out infinite alternate}
@keyframes dg1{to{transform:translate(80px,60px)}}
@keyframes dg2{to{transform:translate(-60px,-80px)}}

/* ── WRAPPER ── */
.wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px 40px}

/* ── HEADER ── */
.brand{font-family:'Cormorant Garamond',serif;font-size:clamp(28px,7vw,44px);font-weight:400;color:#fff;letter-spacing:-1px;text-align:center;margin-bottom:4px}
.brand em{font-style:italic;color:var(--sun)}
.hdr-sub{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.35);text-align:center;margin-bottom:24px}

/* ── PREMIO CARD (antes de girar) ── */
.teaser{text-align:center;margin-bottom:20px;animation:fadeUp .6s var(--ease) both}
.teaser-tag{display:inline-flex;align-items:center;gap:8px;padding:6px 18px;border-radius:50px;background:rgba(242,169,34,.15);border:1px solid rgba(242,169,34,.35);font-size:12px;font-weight:700;color:var(--sun);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
.teaser-title{font-family:'Cormorant Garamond',serif;font-size:clamp(22px,5vw,32px);color:#fff;font-weight:400;line-height:1.2;margin-bottom:6px}
.teaser-sub{font-size:13px;color:rgba(255,255,255,.5);line-height:1.6}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* ── RULETA ── */
.wheel-section{display:flex;flex-direction:column;align-items:center;margin-bottom:20px}
.wheel-outer{position:relative;width:min(320px,80vw);height:min(320px,80vw)}
.wheel-shadow{
  position:absolute;inset:0;border-radius:50%;
  box-shadow:0 0 60px rgba(242,169,34,.3),0 0 120px rgba(242,169,34,.15);
  animation:glowPulse 2.5s ease-in-out infinite;
}
@keyframes glowPulse{0%,100%{opacity:.6}50%{opacity:1}}
.wheel-canvas{width:100%;height:100%;border-radius:50%;display:block}
.wheel-pin{
  position:absolute;top:-18px;left:50%;transform:translateX(-50%);
  width:0;height:0;
  border-left:14px solid transparent;
  border-right:14px solid transparent;
  border-top:28px solid var(--sun);
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.4));
  z-index:10;
}
.wheel-pin::after{
  content:'';position:absolute;top:-32px;left:50%;transform:translateX(-50%);
  width:16px;height:16px;border-radius:50%;
  background:var(--sun);box-shadow:0 0 12px rgba(242,169,34,.8);
}
.wheel-center{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,#fff,#E8E0D0);
  box-shadow:0 4px 20px rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;z-index:5;border:3px solid rgba(255,255,255,.5);
}

/* ── BOTÓN GIRAR ── */
.spin-btn{
  margin-top:22px;
  padding:16px 48px;border-radius:50px;border:none;
  background:linear-gradient(135deg,var(--sun),var(--gold));
  color:var(--ink);font-family:'Jost',sans-serif;
  font-size:16px;font-weight:800;cursor:pointer;
  box-shadow:0 8px 32px rgba(242,169,34,.5);
  transition:all .25s var(--ease);
  letter-spacing:.04em;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  animation:spinBtnPulse 2s ease-in-out infinite;
}
.spin-btn:hover:not(:disabled){transform:translateY(-3px) scale(1.04);box-shadow:0 14px 44px rgba(242,169,34,.6)}
.spin-btn:active:not(:disabled){transform:scale(.97)}
.spin-btn:disabled{opacity:.5;cursor:not-allowed;animation:none}
@keyframes spinBtnPulse{0%,100%{box-shadow:0 8px 32px rgba(242,169,34,.5)}50%{box-shadow:0 8px 52px rgba(242,169,34,.75)}}

.spin-hint{font-size:11.5px;color:rgba(255,255,255,.35);margin-top:10px;text-align:center}

/* ── RESULTADO OVERLAY ── */
.result-overlay{
  position:fixed;inset:0;z-index:100;
  display:none;align-items:center;justify-content:center;
  padding:20px;
  background:rgba(5,21,37,.85);
  backdrop-filter:blur(8px);
}
.result-overlay.show{display:flex}
.result-card{
  background:linear-gradient(160deg,#0D2A40,#0A3D5F);
  border-radius:24px;padding:36px 28px;
  max-width:380px;width:100%;
  text-align:center;
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 24px 80px rgba(0,0,0,.5);
  animation:cardPop .5s var(--ease) both;
  position:relative;overflow:hidden;
}
@keyframes cardPop{from{opacity:0;transform:scale(.8) translateY(30px)}70%{transform:scale(1.04)}to{opacity:1;transform:none}}
.result-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.result-card.premio::before{background:linear-gradient(90deg,var(--reef),var(--sun),var(--gold))}
.result-card.redes::before{background:linear-gradient(90deg,#E1306C,#F77737,#FCAF45)}
.result-card.reintento::before{background:linear-gradient(90deg,var(--sky),var(--ocean))}

.confetti-area{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti-piece{position:absolute;width:8px;height:8px;border-radius:2px;animation:confFall var(--cd,2.5s) ease-in var(--cdl,0s) both}
@keyframes confFall{
  0%{transform:translateY(-20px) rotate(0deg);opacity:1}
  100%{transform:translateY(400px) rotate(720deg);opacity:0}
}

.result-emoji{font-size:56px;margin-bottom:14px;animation:emojiPop .4s var(--ease) .2s both;display:block}
@keyframes emojiPop{from{transform:scale(0) rotate(-15deg)}70%{transform:scale(1.2)}to{transform:scale(1)}}
.result-title{font-family:'Cormorant Garamond',serif;font-size:clamp(24px,6vw,32px);color:#fff;font-weight:400;line-height:1.2;margin-bottom:8px}
.result-desc{font-size:14px;color:rgba(255,255,255,.6);line-height:1.7;margin-bottom:22px}
.result-prize-box{
  background:rgba(242,169,34,.12);border:1.5px solid rgba(242,169,34,.3);
  border-radius:14px;padding:16px;margin-bottom:22px;
}
.result-prize-lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(242,169,34,.7);font-weight:700;margin-bottom:6px}
.result-prize-val{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:var(--sun)}
.result-prize-code{font-size:12px;color:rgba(255,255,255,.4);margin-top:4px}
.result-btns{display:flex;flex-direction:column;gap:10px}
.rbtn{
  display:flex;align-items:center;justify-content:center;gap:9px;
  padding:14px 20px;border-radius:50px;border:none;cursor:pointer;
  font-family:'Jost',sans-serif;font-size:14px;font-weight:700;
  text-decoration:none;transition:all .25s;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;letter-spacing:.03em;
}
.rbtn-ig{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);color:#fff}
.rbtn-fb{background:#1877F2;color:#fff}
.rbtn-spin{background:rgba(255,255,255,.1);color:#fff;border:1.5px solid rgba(255,255,255,.2)}
.rbtn-asesor{background:var(--reef);color:#fff}
.rbtn:hover{transform:translateY(-2px);opacity:.92}
.rbtn:active{transform:scale(.97)}
.result-small{font-size:11.5px;color:rgba(255,255,255,.3);margin-top:12px;line-height:1.6}

/* ── INTENTOS ── */
.intentos-bar{display:flex;gap:6px;justify-content:center;margin-top:8px}
.intento-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.2);transition:background .3s}
.intento-dot.usado{background:rgba(255,255,255,.15)}
.intento-dot.activo{background:var(--sun);box-shadow:0 0 8px rgba(242,169,34,.6)}

/* ── REDES FOOTER ── */
.redes-footer{display:flex;gap:14px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.red-btn{
  display:flex;align-items:center;gap:7px;
  padding:10px 18px;border-radius:50px;
  font-size:12.5px;font-weight:600;color:#fff;
  text-decoration:none;transition:all .22s;
  touch-action:manipulation;
}
.red-ig{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045)}
.red-fb{background:#1877F2}
.red-btn:hover{transform:translateY(-2px);opacity:.9}

/* ── PARTICLES ── */
@keyframes particleFloat{
  0%{transform:translateY(0) translateX(0) scale(1);opacity:.8}
  100%{transform:translateY(-80px) translateX(var(--px,20px)) scale(0);opacity:0}
}
</style>
</head>
<body>

<!-- BG -->
<div class="bg" id="bg">
  <div class="glow g1"></div>
  <div class="glow g2"></div>
</div>

<div class="wrap">
  <div class="brand">AVS<em>TRAVEL</em></div>
  <div class="hdr-sub">Agencia de Viajes · Buenaventura</div>

  <div class="teaser">
    <div class="teaser-tag">🎰 ¡Gira y gana!</div>
    <div class="teaser-title" id="teaser-title">¡Gracias por registrarte!<br>Tienes <em>3 oportunidades</em></div>
    <div class="teaser-sub">Gira la ruleta y descubre tu premio exclusivo de AVSTRAVEL</div>
  </div>

  <div class="wheel-section">
    <div class="wheel-outer">
      <div class="wheel-shadow"></div>
      <div class="wheel-pin"></div>
      <canvas class="wheel-canvas" id="wheel" width="320" height="320"></canvas>
      <div class="wheel-center">✈️</div>
    </div>
    <button class="spin-btn" id="spin-btn" onclick="girar()">¡GIRAR!</button>
    <div class="spin-hint">Tienes <span id="intentos-txt">3</span> giro(s) disponibles</div>
    <div class="intentos-bar">
      <div class="intento-dot activo" id="dot0"></div>
      <div class="intento-dot activo" id="dot1"></div>
      <div class="intento-dot activo" id="dot2"></div>
    </div>
  </div>

  <div class="redes-footer">
    <a class="red-btn red-ig" href="https://www.instagram.com/avstravelpacifico" target="_blank">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
      @avstravelpacifico
    </a>
    <a class="red-btn red-fb" href="https://www.facebook.com/avstravel" target="_blank">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
      avstravel
    </a>
  </div>
</div>

<!-- RESULTADO -->
<div class="result-overlay" id="result-overlay">
  <div class="result-card" id="result-card">
    <div class="confetti-area" id="confetti"></div>
    <span class="result-emoji" id="res-emoji">🎁</span>
    <div class="result-title" id="res-title">¡Felicitaciones!</div>
    <div class="result-desc" id="res-desc">Descripción del resultado</div>
    <div id="res-prize-wrap"></div>
    <div class="result-btns" id="res-btns"></div>
    <div class="result-small" id="res-small"></div>
  </div>
</div>

<script>
// ══════════════════════════════
//  SALUDO PERSONALIZADO
// ══════════════════════════════
const params = new URLSearchParams(window.location.search);
const clienteNombre = params.get('nombre') || '';
if(clienteNombre){
  document.getElementById('teaser-title').innerHTML =
    `¡Hola <em>${clienteNombre}</em>!<br>Tienes <em>3 oportunidades</em>`;
}

// ══════════════════════════════
//  ESTRELLAS BG
// ══════════════════════════════
const bg = document.getElementById('bg');
for(let i=0;i<60;i++){
  const s=document.createElement('div');
  s.className='star';
  const sz=Math.random()*2.5+1;
  s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${2+Math.random()*4}s;--dl:${Math.random()*4}s`;
  bg.appendChild(s);
}

// ══════════════════════════════
//  CONFIGURACIÓN DE LA RULETA
// ══════════════════════════════
const SEGMENTOS = [
  { label:'10% DESC',     emoji:'🎁', tipo:'premio',    color:'#00A878', peso:8  },
  { label:'¡Síguenos!',   emoji:'📸', tipo:'redes',     color:'#E05C3A', peso:25 },
  { label:'Intenta',      emoji:'🔄', tipo:'reintento', color:'#1B7FA6', peso:20 },
  { label:'Check-in\nGratis', emoji:'✅', tipo:'premio', color:'#C8922A', peso:5  },
  { label:'¡Síguenos!',   emoji:'📘', tipo:'redes',     color:'#1877F2', peso:25 },
  { label:'Intenta',      emoji:'🔄', tipo:'reintento', color:'#0A4A6E', peso:15 },
  { label:'Upgrade\nVIP', emoji:'⭐', tipo:'premio',    color:'#9B59B6', peso:2  },
  { label:'¡Síguenos!',   emoji:'📸', tipo:'redes',     color:'#E1306C', peso:0  },
];

// Premios reales
const PREMIOS = [
  { seg:0, titulo:'¡10% de descuento!',     desc:'Aplica en tu próxima reserva con AVSTRAVEL.',     val:'10% OFF en tu reserva', code:'AVS10' },
  { seg:4, titulo:'¡Check-in gratis!',      desc:'Te hacemos el check-in sin costo adicional.',      val:'Check-in gratuito',     code:'AVSCHK' },
  { seg:6, titulo:'¡Upgrade VIP!',          desc:'Mejora de habitación o servicio sin costo extra.', val:'Upgrade VIP incluido',  code:'AVSVIP' },
];

// ══════════════════════════════
//  DIBUJAR RULETA
// ══════════════════════════════
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const cx = canvas.width/2, cy = canvas.height/2, r = cx-6;
const N = SEGMENTOS.length;
const arc = (2*Math.PI)/N;
let rotation = 0;

function drawWheel(rot){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  SEGMENTOS.forEach((seg,i)=>{
    const start = rot + i*arc - Math.PI/2;
    const end   = start + arc;
    // Segmento
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,start,end);
    ctx.closePath();
    ctx.fillStyle = seg.color;
    ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.25)';
    ctx.lineWidth=2;
    ctx.stroke();
    // Texto
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(start + arc/2);
    ctx.textAlign='right';
    ctx.fillStyle='#fff';
    ctx.shadowColor='rgba(0,0,0,.5)';
    ctx.shadowBlur=4;
    // Emoji
    ctx.font=`${Math.floor(r*.14)}px sans-serif`;
    ctx.fillText(seg.emoji, r*.82, 5);
    // Label
    const lines=seg.label.split('\n');
    ctx.font=`700 ${Math.floor(r*.088)}px Jost,sans-serif`;
    ctx.shadowBlur=3;
    if(lines.length>1){
      ctx.fillText(lines[0], r*.72, -4);
      ctx.fillText(lines[1], r*.72, 12);
    } else {
      ctx.fillText(lines[0], r*.72, 5);
    }
    ctx.restore();
  });
  // Borde exterior
  ctx.beginPath();
  ctx.arc(cx,cy,r,0,2*Math.PI);
  ctx.strokeStyle='rgba(255,255,255,.4)';
  ctx.lineWidth=3;
  ctx.stroke();
}
drawWheel(rotation);

// ══════════════════════════════
//  LÓGICA DE GIRO
// ══════════════════════════════
let intentos = 3;
let girando = false;
let yaPremio = false;
let intentoActual = 0;

function updateDots(){
  for(let i=0;i<3;i++){
    const d=document.getElementById('dot'+i);
    if(i < intentos) d.className='intento-dot activo';
    else d.className='intento-dot usado';
  }
  document.getElementById('intentos-txt').textContent = intentos;
}

function elegirSegmento(){
  // En el 3er intento siempre va a redes si no ganó premio
  if(intentos===1 && !yaPremio){
    // Forzar redes — buscar índice de redes
    const redesIdx=[1,4,7].filter(i=>i<N);
    return redesIdx[Math.floor(Math.random()*redesIdx.length)];
  }
  // Probabilidad normal
  const pesos = SEGMENTOS.map(s=>s.peso);
  const total = pesos.reduce((a,b)=>a+b,0);
  let rand = Math.random()*total;
  for(let i=0;i<SEGMENTOS.length;i++){
    rand -= pesos[i];
    if(rand<=0) return i;
  }
  return 0;
}

function girar(){
  if(girando || intentos<=0) return;
  girando=true;
  document.getElementById('spin-btn').disabled=true;

  const segIdx = elegirSegmento();
  intentos--;
  intentoActual++;
  updateDots();

  // Calcular ángulo destino — el segmento elegido debe quedar bajo el pin (arriba = -PI/2)
  const segCenter = segIdx * arc + arc/2;
  const extraVueltas = (5 + Math.floor(Math.random()*4)) * 2 * Math.PI;
  const targetRot = extraVueltas + (2*Math.PI - segCenter) - (rotation % (2*Math.PI));

  const totalAngle = targetRot;
  const duration = 4000 + Math.random()*1500;
  const start = performance.now();
  const startRot = rotation;

  function easeOut(t){ return 1 - Math.pow(1-t, 4); }

  function animate(now){
    const elapsed = now - start;
    const t = Math.min(elapsed/duration, 1);
    rotation = startRot + totalAngle * easeOut(t);
    drawWheel(rotation);
    if(t<1){ requestAnimationFrame(animate); }
    else {
      girando=false;
      setTimeout(()=>mostrarResultado(segIdx), 400);
    }
  }
  requestAnimationFrame(animate);
}

// ══════════════════════════════
//  MOSTRAR RESULTADO
// ══════════════════════════════
function mostrarResultado(segIdx){
  const seg = SEGMENTOS[segIdx];
  const overlay = document.getElementById('result-overlay');
  const card = document.getElementById('result-card');

  card.className = 'result-card ' + seg.tipo;
  document.getElementById('res-emoji').textContent = seg.emoji;

  const prizeWrap = document.getElementById('res-prize-wrap');
  const btns = document.getElementById('res-btns');
  const small = document.getElementById('res-small');

  if(seg.tipo === 'premio'){
    yaPremio = true;
    const premio = PREMIOS.find(p=>p.seg===segIdx) || PREMIOS[0];
    document.getElementById('res-title').textContent = '¡Ganaste!';
    document.getElementById('res-desc').textContent = premio.desc;
    prizeWrap.innerHTML = `
      <div class="result-prize-box">
        <div class="result-prize-lbl">Tu premio</div>
        <div class="result-prize-val">${premio.val}</div>
        <div class="result-prize-code">Código: <strong style="color:var(--sun)">${premio.code}</strong> · Muéstralo a tu asesor</div>
      </div>`;
    btns.innerHTML = `
      <a class="rbtn rbtn-ig" href="https://www.instagram.com/avstravelpacifico" target="_blank">
        📸 Síguenos en Instagram para más beneficios
      </a>
      <a class="rbtn rbtn-fb" href="https://www.facebook.com/avstravel" target="_blank">
        📘 Síguenos en Facebook
      </a>
      <a class="rbtn rbtn-asesor" href="https://wa.me/573153945461" target="_blank">
        💬 Hablar con mi asesor ahora
      </a>`;
    small.textContent = 'Premio válido por 30 días · Presenta este código a tu asesor al momento de reservar';
    lanzarConfetti();

  } else if(seg.tipo === 'redes'){
    document.getElementById('res-title').textContent = '¡Conéctate con nosotros!';
    document.getElementById('res-desc').textContent = 'Síguenos y sé el primero en enterarte de ofertas exclusivas, promociones y los mejores destinos del Pacífico y Colombia.';
    prizeWrap.innerHTML = `
      <div style="background:rgba(255,255,255,.06);border-radius:12px;padding:14px;margin-bottom:18px;font-size:13px;color:rgba(255,255,255,.6);line-height:1.6">
        📣 Publicamos promos exclusivas, fotos de destinos y sorteos solo para seguidores
      </div>`;
    btns.innerHTML = `
      <a class="rbtn rbtn-ig" href="https://www.instagram.com/avstravelpacifico" target="_blank">
        📸 Seguir en Instagram · @avstravelpacifico
      </a>
      <a class="rbtn rbtn-fb" href="https://www.facebook.com/avstravel" target="_blank">
        📘 Seguir en Facebook · avstravel
      </a>
      ${intentos>0 ? `<button class="rbtn rbtn-spin" onclick="cerrarYGirar()">🔄 Seguir y volver a girar (${intentos} giro${intentos!==1?'s':''})</button>` : `<a class="rbtn rbtn-asesor" href="https://wa.me/573153945461" target="_blank">💬 Hablar con mi asesor</a>`}`;
    small.textContent = intentos>0 ? `Aún tienes ${intentos} giro${intentos!==1?'s':''} disponible${intentos!==1?'s':''}. ¡Sigue y vuelve a intentar!` : 'Gracias por participar. Tu asesor te contactará pronto.';

  } else { // reintento
    document.getElementById('res-title').textContent = '¡Casi!';
    document.getElementById('res-desc').textContent = intentos>0
      ? `¡No te rindas! Aún tienes ${intentos} giro${intentos!==1?'s':''} disponible${intentos!==1?'s':''}.`
      : 'Sigue a AVSTRAVEL para no perderte las próximas promos y sorteos exclusivos.';
    prizeWrap.innerHTML = '';
    if(intentos>0){
      btns.innerHTML = `
        <button class="rbtn rbtn-spin" onclick="cerrarYGirar()" style="background:var(--sun);color:var(--ink)">
          🎰 Volver a girar (${intentos} disponible${intentos!==1?'s':''})
        </button>
        <a class="rbtn rbtn-ig" href="https://www.instagram.com/avstravelpacifico" target="_blank">
          📸 Síguenos mientras tanto
        </a>`;
      small.textContent = '¡La suerte puede cambiar en el próximo giro!';
    } else {
      btns.innerHTML = `
        <a class="rbtn rbtn-ig" href="https://www.instagram.com/avstravelpacifico" target="_blank">
          📸 Seguir en Instagram
        </a>
        <a class="rbtn rbtn-fb" href="https://www.facebook.com/avstravel" target="_blank">
          📘 Seguir en Facebook
        </a>
        <a class="rbtn rbtn-asesor" href="https://wa.me/573153945461" target="_blank">
          💬 Hablar con mi asesor
        </a>`;
      small.textContent = 'Tu asesor ya tiene tu solicitud. Te contactará en breve.';
    }
  }

  overlay.classList.add('show');
}

function cerrarYGirar(){
  document.getElementById('result-overlay').classList.remove('show');
  if(intentos<=0){
    document.getElementById('spin-btn').disabled=true;
    document.getElementById('spin-btn').textContent='Sin giros';
    return;
  }
  document.getElementById('spin-btn').disabled=false;
  setTimeout(()=>girar(), 300);
}

// ══════════════════════════════
//  CONFETTI
// ══════════════════════════════
function lanzarConfetti(){
  const area = document.getElementById('confetti');
  area.innerHTML='';
  const colors=['#F2A922','#00A878','#E05C3A','#1B7FA6','#fff','#9B59B6','#E1306C'];
  for(let i=0;i<50;i++){
    const p=document.createElement('div');
    p.className='confetti-piece';
    p.style.cssText=`
      left:${Math.random()*100}%;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      --cd:${1.5+Math.random()*2}s;
      --cdl:${Math.random()*1}s;
      transform:rotate(${Math.random()*360}deg);
      border-radius:${Math.random()>0.5?'50%':'2px'};
    `;
    area.appendChild(p);
  }
}

// Init dots
updateDots();
</script>
